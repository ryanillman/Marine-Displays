[platformio]
default_envs = waveshare_lcd7

[env:waveshare_lcd7]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 115200

build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++2a
    -DCORE_DEBUG_LEVEL=0
    -DLOG_LOCAL_LEVEL=0
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_USE_DRAW_SW_ASM=0
    -DLV_USE_NATIVE_HELIUM_ASM=0
    -DLV_USE_ARM2D=0
    ; Log and download go out the CH343 on UART0. CDC-on-boot would move
    ; Serial onto native USB (GPIO19/20), which this cable does not show.
    -I include
    -I src
    -I ../ESP32-S3_Square_Display/include
    -I ../ESP32-S3_Square_Display/src
    ; SquareLine canvases stay 480. The panel is 800 wide; the LVGL flush
    ; letterboxes. Do not set these to 800.
    -DSCREEN_WIDTH=480
    -DSCREEN_HEIGHT=480
    -DLV_HOR_RES_MAX=480
    -DLV_VER_RES_MAX=480
    -DCONFIG_ESP32S3_DATA_CACHE_LINE_64B=1
    -DCONFIG_SPIRAM_SPEED_120M=1
    -DCONFIG_LCD_RGB_RESTART_IN_VSYNC=1
    -DCONFIG_ESP_WIFI_NVS_ENABLED=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096
    -DCONFIG_LWIP_MAX_SOCKETS=6
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=32768
    -I ..
    -DBOARD_ID_LCD7

extra_scripts =
    pre:../inject_version.py
    fix_ota_boot.py

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.offset_address = 0x100000
board_build.partitions = partitions.csv
board_build.filesystem = spiffs

lib_deps =
    symlink://../common/marine-common
    symlink://../common/marine-fonts
    symlink://../common/marine-hal
    symlink://../common/marine-widgets
    lvgl/lvgl@^8.4.0
    bblanchon/ArduinoJson
    Links2004/WebSockets
